<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gnome Deep: Maze of Greed</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0b0812;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: #e8dcc0;
  }
  canvas#game { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; top: 14px; left: 16px;
    pointer-events: none;
    text-shadow: 0 2px 4px #000;
    max-width: calc(100vw - 280px);
  }
  #hud h1 { font-size: 22px; letter-spacing: 2px; color: #f2c14e; }
  #hud h1 span { color: #c9b28a; font-size: 15px; letter-spacing: 1px; }
  #hud p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  #hud #stats { font-size: 17px; opacity: 1; margin-top: 10px; color: #f5ead0; }
  #stats .warn { color: #ff7a5a; }

  #mapPanel {
    position: fixed; top: 14px; right: 16px;
    background: rgba(14, 10, 22, 0.82);
    border: 1px solid #5a4632;
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(242,193,78,0.08);
    pointer-events: none;
  }
  #mapPanel .title {
    display: flex; justify-content: space-between; gap: 12px;
    font-size: 11px; letter-spacing: 2px; color: #f2c14e;
    margin-bottom: 6px;
  }
  #mapPanel .title span { color: #8c7a5c; letter-spacing: 1px; }
  #minimap { display: block; border-radius: 4px; }
  #mapInfo { font-size: 11px; color: #c9b28a; margin-top: 6px; line-height: 1.5; }

  #overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    background: rgba(5, 3, 10, 0.6);
    text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay > div {
    padding: 28px 36px; border-radius: 10px;
    background: rgba(20, 14, 30, 0.92);
    border: 1px solid #f2c14e;
    box-shadow: 0 0 40px rgba(242,193,78,0.25);
    max-width: 90vw;
  }
  #overlay.dead > div { border-color: #c0392b; box-shadow: 0 0 40px rgba(192,57,43,0.35); }
  #overlay h2 { color: #f2c14e; letter-spacing: 2px; margin-bottom: 8px; }
  #overlay.dead h2 { color: #ff6b5a; }
  #overlay p { opacity: 0.85; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <h1>GNOME DEEP <span>: Maze of Greed</span></h1>
  <p>A / D or ← / → to walk &nbsp;·&nbsp; Space (or W / ↑) to jump</p>
  <p>At a ladder junction: W / ↑ to climb up, S / ↓ to climb down, or keep walking straight</p>
  <p id="stats"></p>
</div>
<div id="mapPanel">
  <div class="title">MINIMAP <span>[M] resize</span></div>
  <canvas id="minimap"></canvas>
  <div id="mapInfo"></div>
</div>
<div id="overlay"><div>
  <h2 id="overlayTitle"></h2>
  <p id="overlayText"></p>
  <p id="overlayHint" style="margin-top:10px"></p>
</div></div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------------------
  // Canvas setup
  // ---------------------------------------------------------------------------
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const rockCanvas = document.createElement('canvas');   // offscreen: rock with tunnels carved out
  const rctx = rockCanvas.getContext('2d');
  const mapCanvas = document.getElementById('minimap');
  const mctx = mapCanvas.getContext('2d');
  const mapInfoEl = document.getElementById('mapInfo');
  const statsEl = document.getElementById('stats');
  const overlayEl = document.getElementById('overlay');
  const overlayTitleEl = document.getElementById('overlayTitle');
  const overlayTextEl = document.getElementById('overlayText');
  const overlayHintEl = document.getElementById('overlayHint');
  let W = 0, H = 0, DPR = 1;
  let mapBig = false, MW = 220, MH = 160;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const [c, cx] of [[canvas, ctx], [rockCanvas, rctx]]) {
      c.width = Math.floor(W * DPR);
      c.height = Math.floor(H * DPR);
      cx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    sizeMinimap();
  }

  function sizeMinimap() {
    MW = mapBig ? Math.floor(Math.min(560, W * 0.5)) : Math.floor(Math.min(220, W * 0.4));
    MH = mapBig ? Math.floor(Math.min(420, H * 0.6)) : Math.floor(Math.min(160, H * 0.3));
    mapCanvas.width = Math.floor(MW * DPR);
    mapCanvas.height = Math.floor(MH * DPR);
    mapCanvas.style.width = MW + 'px';
    mapCanvas.style.height = MH + 'px';
    mctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // ---------------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------------
  const keys = new Set();
  const pressedAt = { jump: -Infinity, up: -Infinity, down: -Infinity };
  const INPUT_BUFFER = 0.12;

  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    if (!keys.has(e.code)) {
      const now = performance.now();
      if (e.code === 'Space') pressedAt.jump = now;
      if (e.code === 'KeyW' || e.code === 'ArrowUp') pressedAt.up = now;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') pressedAt.down = now;
      if (e.code === 'KeyM') { mapBig = !mapBig; sizeMinimap(); }
      if (e.code === 'Enter' && state === 'won') nextMine();
      if (e.code === 'Enter' && state === 'dead') restartRun();
    }
    keys.add(e.code);
  });
  window.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  const left     = () => keys.has('KeyA') || keys.has('ArrowLeft');
  const right    = () => keys.has('KeyD') || keys.has('ArrowRight');
  const upHeld   = () => keys.has('KeyW') || keys.has('ArrowUp');
  const downHeld = () => keys.has('KeyS') || keys.has('ArrowDown');
  const jumpHeld = () => keys.has('Space') || upHeld();
  const fresh = t => (performance.now() - t) / 1000 < INPUT_BUFFER;

  // ---------------------------------------------------------------------------
  // Noise for decorative background (not seed dependent)
  // ---------------------------------------------------------------------------
  function hash(n, salt) {
    let h = (n * 374761393 + salt * 668265263) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  function smoothNoise(x, salt) {
    const i = Math.floor(x), f = x - i;
    const t = f * f * (3 - 2 * f);
    return hash(i, salt) * (1 - t) + hash(i + 1, salt) * t;
  }

  // ---------------------------------------------------------------------------
  // Seeded randomness — every value is a pure function of (seed, coordinates),
  // so a seed always yields the same mine regardless of exploration order.
  // ---------------------------------------------------------------------------
  function mix(h) {
    h = Math.imul(h ^ (h >>> 16), 0x7feb352d);
    h = Math.imul(h ^ (h >>> 15), 0x846ca68b);
    return (h ^ (h >>> 16)) >>> 0;
  }
  function rnd(a, b, salt) {
    let h = mix(seed ^ 0x9e3779b9);
    h = mix(h + Math.imul(a | 0, 0x27d4eb2d));
    h = mix(h + Math.imul(b | 0, 0x165667b1));
    h = mix(h + salt);
    return h / 4294967296;
  }

  // ---------------------------------------------------------------------------
  // Mine layout
  //
  // The mine is a grid: each column `s` is a tunnel segment CW pixels wide, and
  // each row is a tunnel level RH pixels apart. Junction `j` sits at x = j*CW,
  // between segments j-1 and j. A junction can hold a ladder shaft linking row
  // r to row r+1. Segments may be caved in (closed), forming dead ends.
  //
  // A guaranteed "spine" random walk (one open row per column, plus shafts
  // wherever it changes level) ensures the exit is always reachable, always
  // heading right — away from the advancing cave-in.
  // ---------------------------------------------------------------------------
  const CW = 900;          // segment width
  const RH = 380;          // vertical distance between tunnel floors
  const TUN_H = 220;       // tunnel height
  const ROOM_HALF = 70;    // half-width of the chamber at a junction
  const SHAFT_HALF = 34;   // half-width of a ladder shaft
  const START_ROW = 2;
  const CHUNK_ROWS = 8;    // rows per generated chunk
  const OPEN_CHANCE = 0.6;
  const SHAFT_CHANCE = 0.3;

  let seed = 0, mineNo = 1;
  let spineCache, chunks, explored, collected, exit;

  function spineStep(cx) {
    const r = rnd(cx, 0, 1);
    return r < 0.28 ? -1 : r < 0.6 ? 1 : 0;   // slight downward bias — we're going deep
  }
  function spineRow(cx) {
    if (spineCache.has(cx)) return spineCache.get(cx);
    const towardZero = cx > 0 ? -1 : 1;
    let k = cx;
    while (!spineCache.has(k)) k += towardZero;
    let row = spineCache.get(k);
    while (k !== cx) {
      k -= towardZero;
      row = Math.max(0, row + spineStep(k));
      spineCache.set(k, row);
    }
    return row;
  }

  // A chunk = one column of segments (and its left junction) for CHUNK_ROWS rows.
  function genChunk(cx, rb) {
    const segs = new Uint8Array(CHUNK_ROWS);
    const shafts = new Uint8Array(CHUNK_ROWS);
    const sp = spineRow(cx), prev = spineRow(cx - 1);
    const spineShaft = sp !== prev ? Math.min(sp, prev) : -1;
    for (let i = 0; i < CHUNK_ROWS; i++) {
      const row = rb * CHUNK_ROWS + i;
      if (row < 0) continue;
      segs[i] = row === sp || rnd(cx, row, 2) < OPEN_CHANCE ? 1 : 0;
      shafts[i] = row === spineShaft || rnd(cx, row, 3) < SHAFT_CHANCE ? 1 : 0;
    }
    return { cx, rb, segs, shafts, items: new Array(CHUNK_ROWS) };
  }
  function getChunk(cx, rb) {
    const key = cx + ',' + rb;
    let c = chunks.get(key);
    if (!c) { c = genChunk(cx, rb); chunks.set(key, c); }
    return c;
  }
  function segOpen(s, row) {
    if (row < 0) return false;
    const rb = Math.floor(row / CHUNK_ROWS);
    return getChunk(s, rb).segs[row - rb * CHUNK_ROWS] === 1;
  }
  // Ladder shaft at junction j from `row` down to `row + 1`
  function shaftAt(j, row) {
    if (row < 0) return false;
    const rb = Math.floor(row / CHUNK_ROWS);
    return getChunk(j, rb).shafts[row - rb * CHUNK_ROWS] === 1;
  }
  function roomAt(j, row) {
    return segOpen(j - 1, row) || segOpen(j, row) || shaftAt(j, row) || shaftAt(j, row - 1);
  }
  function isCarved(x, row) {
    if (segOpen(Math.floor(x / CW), row)) return true;
    const j = Math.round(x / CW);
    return Math.abs(x - j * CW) <= ROOM_HALF && roomAt(j, row);
  }

  // ---------------------------------------------------------------------------
  // Items — Diamonds and Junk, seeded per tunnel segment. Each segment has a
  // hidden "richness" so whole routes lean rich or junky (hinted at junctions).
  // ---------------------------------------------------------------------------
  const ITEM_LIFT = 26;        // item centre height above the floor
  const REVEAL_FAR = 140;      // orb starts morphing into its true shape
  const REVEAL_NEAR = 85;      // fully revealed

  function itemsFor(s, row) {
    if (row < 0) return [];
    const rb = Math.floor(row / CHUNK_ROWS), i = row - rb * CHUNK_ROWS;
    const c = getChunk(s, rb);
    if (c.items[i]) return c.items[i];
    const list = [];
    if (c.segs[i] && !(s === 0 && row === START_ROW)) {
      const q = rnd(s, row, 70);
      const pDiamond = q < 0.35 ? 0.8 : q < 0.7 ? 0.5 : 0.2;
      const n = 2 + Math.floor(rnd(s, row, 71) * 3);
      for (let k = 0; k < n; k++) {
        list.push({
          id: s + ',' + row + ',' + k,
          x: s * CW + 140 + (k + 0.2 + rnd(s, row, 80 + k) * 0.6) * (620 / n),
          row,
          type: rnd(s, row, 90 + k) < pDiamond ? 'diamond' : 'junk',
          variant: rnd(s, row, 100 + k) < 0.5 ? 0 : 1,
        });
      }
    }
    c.items[i] = list;
    return list;
  }

  // Remaining diamonds minus junk in a segment (0 if caved in)
  function segValue(s, row) {
    if (!segOpen(s, row)) return 0;
    let v = 0;
    for (const it of itemsFor(s, row)) if (!collected.has(it.id)) v += it.type === 'diamond' ? 1 : -1;
    return v;
  }

  // ---------------------------------------------------------------------------
  // Physics constants
  // ---------------------------------------------------------------------------
  const GRAVITY = 2200;
  const MOVE_ACCEL = 2600;
  const MAX_SPEED = 300;
  const FRICTION = 2200;
  const AIR_CONTROL = 0.6;
  const JUMP_VEL = 780;
  const COYOTE_TIME = 0.1;
  const CLIMB_SPEED = 420;
  const GNOME_BACK = 14;       // body extent behind the gnome
  const BARROW_FRONT = 66;     // wheelbarrow nose in front of the gnome
  const GNOME_TOP = 70;        // feet to hat tip
  const JUNK_DIAMOND_LOSS = 3;
  const JUNK_SLOWDOWN = 0.9;
  const MIN_SPEED_MULT = 0.5;

  // Cave-in wall
  const WALL_BASE_SPEED = 65;
  const WALL_ACCEL = 0.8;      // px/s gained per second
  const WALL_MAX_SPEED = 150;
  const WALL_LEASH = 260;      // never further than this beyond the screen's left edge

  const gnome = {
    x: 0, y: 0, row: 0, vx: 0, vy: 0,
    facing: 1, onGround: true, lastGrounded: 0,
    walkPhase: 0, wheelAngle: 0, squash: 1, climb: null,
  };

  // Camera keeps the gnome near screen centre with a small horizontal dead zone
  const camera = { x: 0, y: 0 };
  const DEAD_ZONE = 40;

  let time = 0, mineTime = 0;
  let state = 'play';          // 'play' | 'won' | 'dead'
  let diamonds = 0, speedMult = 1;
  let wallX = 0, shake = 0;
  const particles = [];

  function initMine(newSeed) {
    seed = newSeed >>> 0;
    spineCache = new Map([[0, START_ROW]]);
    chunks = new Map();
    explored = new Set();
    collected = new Set();
    const exitCx = 12 + Math.floor(rnd(0, 0, 9) * 8);
    exit = { cx: exitCx, row: spineRow(exitCx), x: exitCx * CW + CW / 2 };

    Object.assign(gnome, {
      x: CW / 2, row: START_ROW, y: START_ROW * RH, vx: 0, vy: 0,
      facing: 1, onGround: true, lastGrounded: 0, climb: null, squash: 1,
    });
    camera.x = gnome.x - W / 2;
    camera.y = gnome.y - H * 0.62;
    wallX = gnome.x - W / 2 - WALL_LEASH;
    mineTime = 0;
    particles.length = 0;
    state = 'play';
    overlayEl.className = '';

    try {
      const u = new URL(location.href);
      u.searchParams.set('seed', seed);
      history.replaceState(null, '', u);
    } catch (_) { /* file:// or sandboxed — seed still shown in the panel */ }
  }

  // Diamonds and slowdown carry over into the next mine
  function nextMine() {
    mineNo++;
    initMine(mix(seed + 1));
  }

  // After a cave-in, retry the same mine from scratch
  function restartRun() {
    mineNo = 1;
    diamonds = 0;
    speedMult = 1;
    initMine(seed);
  }

  function showOverlay(kind, title, text, hint) {
    state = kind;
    overlayTitleEl.textContent = title;
    overlayTextEl.textContent = text;
    overlayHintEl.innerHTML = hint;
    overlayEl.className = 'show ' + kind;
  }

  // Drop chunks far from the gnome so memory stays bounded on endless walks
  function evictChunks() {
    if (chunks.size < 600) return;
    const gs = Math.floor(gnome.x / CW);
    for (const [key, c] of chunks) if (Math.abs(c.cx - gs) > 30) chunks.delete(key);
  }

  // ---------------------------------------------------------------------------
  // Particles & floating text (purely visual — Math.random is fine here)
  // ---------------------------------------------------------------------------
  function spawn(p) { particles.push(Object.assign({ vx: 0, vy: 0, g: 0, size: 3, life: 1 }, p, { max: p.life || 1 })); }

  function burstSparkle(x, y) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 140;
      spawn({ kind: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.3, size: 2 + Math.random() * 2 });
    }
  }
  function burstDust(x, y, n, spread) {
    for (let i = 0; i < n; i++) {
      spawn({ kind: 'dust', x: x + (Math.random() - 0.5) * spread, y: y - Math.random() * 20,
        vx: (Math.random() - 0.5) * 80, vy: -20 - Math.random() * 40, life: 0.8 + Math.random() * 0.6, size: 8 + Math.random() * 10 });
    }
  }
  function floatText(x, y, text, color) {
    spawn({ kind: 'text', x, y, vy: -45, life: 1.2, text, color });
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.kind === 'spark' || p.kind === 'dust') { p.vx *= 1 - dt * 3; p.vy *= 1 - dt * 3; }
    }
  }

  // ---------------------------------------------------------------------------
  // Update
  // ---------------------------------------------------------------------------
  function junctionInfo() {
    const g = gnome;
    const j = Math.round(g.x / CW);
    const near = Math.abs(g.x - j * CW) <= ROOM_HALF - 10;
    return { j, canUp: near && shaftAt(j, g.row - 1), canDown: near && shaftAt(j, g.row) };
  }

  function startClimb(j, targetRow) {
    Object.assign(gnome, { climb: { j, targetRow }, vx: 0, vy: 0, onGround: false });
  }

  function updateClimb(dt) {
    const g = gnome, c = g.climb;
    const dx = c.j * CW - g.x;
    g.x += Math.max(-300 * dt, Math.min(300 * dt, dx));
    const ty = c.targetRow * RH, dy = ty - g.y, step = CLIMB_SPEED * speedMult * dt;
    g.y += Math.abs(dy) <= step ? dy : Math.sign(dy) * step;
    g.walkPhase += dt * 10;
    if (g.y === ty) {
      g.row = c.targetRow;
      g.climb = null;
      g.onGround = true;
      g.lastGrounded = time;
    }
  }

  // Horizontal extent of gnome + wheelbarrow for a facing direction
  const extents = facing => facing > 0 ? [-GNOME_BACK, BARROW_FRONT] : [-BARROW_FRONT, GNOME_BACK];
  function fits(x, facing) {
    const [a, b] = extents(facing);
    return isCarved(x + a, gnome.row) && isCarved(x + b, gnome.row);
  }

  function updateWalk(dt) {
    const g = gnome;
    const floor = g.row * RH;
    const maxSpeed = MAX_SPEED * speedMult;

    // Route choice at junctions: up/down ladders, or keep walking straight
    if (g.onGround) {
      const jn = junctionInfo();
      if (jn.canUp && (fresh(pressedAt.up) || upHeld())) {
        pressedAt.up = -Infinity;
        return startClimb(jn.j, g.row - 1);
      }
      if (jn.canDown && (fresh(pressedAt.down) || downHeld())) {
        pressedAt.down = -Infinity;
        return startClimb(jn.j, g.row + 1);
      }
    }

    // Turning around swings the wheelbarrow to the other side — only if it fits
    const dir = (right() ? 1 : 0) - (left() ? 1 : 0);
    if (dir !== 0 && dir !== g.facing) {
      if (fits(g.x, dir)) g.facing = dir;
      else if (fits(g.x - dir * (BARROW_FRONT - GNOME_BACK), dir)) {
        g.x -= dir * (BARROW_FRONT - GNOME_BACK);
        g.facing = dir;
      }
    }

    const control = g.onGround ? 1 : AIR_CONTROL;
    if (dir !== 0) {
      g.vx += dir * MOVE_ACCEL * speedMult * control * dt;
    } else if (g.onGround) {
      const dec = FRICTION * dt;
      g.vx = Math.abs(g.vx) <= dec ? 0 : g.vx - Math.sign(g.vx) * dec;
    }
    g.vx = Math.max(-maxSpeed, Math.min(maxSpeed, g.vx));

    // Jumping with coyote time + input buffering (W/Up jumps when there's no ladder)
    if (g.onGround) g.lastGrounded = time;
    if ((fresh(pressedAt.jump) || fresh(pressedAt.up)) && time - g.lastGrounded < COYOTE_TIME) {
      g.vy = -JUMP_VEL;
      g.onGround = false;
      g.lastGrounded = -Infinity;
      pressedAt.jump = pressedAt.up = -Infinity;
      g.squash = 1.25;
    }

    // Variable jump height: release early for a short hop
    if (!jumpHeld() && g.vy < 0) g.vy += GRAVITY * 1.6 * dt;
    g.vy += GRAVITY * dt;

    // Move horizontally, stopping flush against cave-ins and dead ends
    const nx = g.x + g.vx * dt;
    if (fits(nx, g.facing)) {
      g.x = nx;
    } else {
      const s = Math.sign(nx - g.x);
      while (Math.abs(nx - g.x) >= 1 && fits(g.x + s, g.facing)) g.x += s;
      g.vx = 0;
    }

    g.y += g.vy * dt;

    // Ceiling
    const ceil = floor - TUN_H;
    if (g.y - GNOME_TOP < ceil) { g.y = ceil + GNOME_TOP; g.vy = Math.max(0, g.vy); }

    // Floor
    if (g.y >= floor) {
      if (!g.onGround && g.vy > 300) g.squash = 0.75;
      g.y = floor;
      g.vy = 0;
      g.onGround = true;
    } else {
      g.onGround = false;
    }

    if (g.onGround && Math.abs(g.vx) > 10) g.walkPhase += dt * Math.abs(g.vx) * 0.05;
    g.wheelAngle += g.vx * dt / 8;
  }

  // Gnome or wheelbarrow touching an item collects it (jump over junk to dodge it)
  function collectItems() {
    const g = gnome;
    if (g.climb) return;
    const [a, b] = extents(g.facing);
    const s = Math.floor(g.x / CW);
    const itemY = g.row * RH - ITEM_LIFT;
    if (g.y < itemY - 10) return;           // airborne above the items
    for (let k = s - 1; k <= s + 1; k++) {
      for (const it of itemsFor(k, g.row)) {
        if (collected.has(it.id) || it.x < g.x + a - 8 || it.x > g.x + b + 8) continue;
        collected.add(it.id);
        const bx = g.x + g.facing * 44, by = g.y - 40;
        if (it.type === 'diamond') {
          diamonds++;
          burstSparkle(it.x, itemY);
          floatText(bx, by - 20, '+1 💎', '#7fe8ff');
        } else {
          const lost = Math.min(diamonds, JUNK_DIAMOND_LOSS);
          diamonds -= lost;
          speedMult = Math.max(MIN_SPEED_MULT, speedMult * JUNK_SLOWDOWN);
          shake = Math.max(shake, 9);
          burstDust(it.x, g.row * RH, 10, 40);
          for (let i = 0; i < lost; i++) {
            spawn({ kind: 'gem', x: bx, y: by, vx: (Math.random() - 0.5) * 260, vy: -260 - Math.random() * 160,
              g: 1400, life: 0.9, size: 5 });
          }
          floatText(bx, by - 20, lost ? `-${lost} 💎  Slower!` : 'Junk! Slower!', '#ff8a6a');
        }
      }
    }
  }

  function updateWall(dt) {
    const g = gnome;
    const speed = Math.min(WALL_MAX_SPEED, WALL_BASE_SPEED + mineTime * WALL_ACCEL);
    wallX = Math.max(wallX + speed * dt, g.x - W / 2 - WALL_LEASH);

    const gap = g.x + extents(g.facing)[0] - wallX;
    if (gap < 500) shake = Math.max(shake, (1 - Math.max(0, gap) / 500) * 5);

    // Falling rubble along the advancing face
    const sx = wallX - camera.x;
    if (sx > -40 && Math.random() < dt * 14) {
      spawn({ kind: 'rock', x: wallX - Math.random() * 30, y: camera.y + Math.random() * H * 0.4,
        vx: 20 + Math.random() * 40, vy: 0, g: 1200, life: 1.2, size: 3 + Math.random() * 6 });
    }
    if (sx > -40 && Math.random() < dt * 6) {
      spawn({ kind: 'dust', x: wallX + 10, y: camera.y + Math.random() * H, vx: 30 + Math.random() * 30, vy: -10,
        life: 1.2, size: 18 + Math.random() * 18 });
    }

    if (gap <= 0) {
      shake = 14;
      showOverlay('dead', 'CAVE-IN!',
        `The mine collapsed on you with ${diamonds} diamond${diamonds === 1 ? '' : 's'} in the wheelbarrow.`,
        'Press <b>Enter</b> to try this mine again');
    }
  }

  function markExplored() {
    const s0 = Math.floor(camera.x / CW), s1 = Math.floor((camera.x + W) / CW);
    const r0 = Math.max(0, Math.floor(camera.y / RH)), r1 = Math.floor((camera.y + H + TUN_H) / RH);
    for (let row = r0; row <= r1; row++) {
      const floor = row * RH;
      if (floor < camera.y || floor - TUN_H > camera.y + H) continue;
      for (let s = s0; s <= s1; s++) if (segOpen(s, row)) explored.add('s' + s + ',' + row);
    }
    for (let row = Math.max(0, r0 - 1); row <= r1; row++) {
      if ((row + 1) * RH < camera.y || row * RH > camera.y + H) continue;
      for (let j = s0; j <= s1 + 1; j++) {
        const x = j * CW;
        if (x < camera.x - SHAFT_HALF || x > camera.x + W + SHAFT_HALF) continue;
        if (shaftAt(j, row)) explored.add('j' + j + ',' + row);
      }
    }
  }

  let lastInfo = '', lastStats = '';
  function update(dt) {
    time += dt;
    const g = gnome;

    if (state === 'play') {
      mineTime += dt;
      if (g.climb) updateClimb(dt);
      else updateWalk(dt);
      collectItems();
      updateWall(dt);
    }

    g.squash += (1 - g.squash) * Math.min(1, dt * 12);
    shake = Math.max(0, shake - dt * 20);
    updateParticles(dt);

    // Camera
    const diff = g.x - W / 2 - camera.x;
    if (diff > DEAD_ZONE) camera.x += (diff - DEAD_ZONE) * Math.min(1, dt * 8);
    else if (diff < -DEAD_ZONE) camera.x += (diff + DEAD_ZONE) * Math.min(1, dt * 8);
    camera.y += (g.y - H * 0.62 - camera.y) * Math.min(1, dt * 6);

    markExplored();
    evictChunks();

    if (state === 'play' && !g.climb && g.row === exit.row && Math.abs(g.x - exit.x) < 40) {
      showOverlay('won', 'EXIT FOUND!',
        `You escaped mine #${mineNo} with ${diamonds} diamond${diamonds === 1 ? '' : 's'} in the wheelbarrow.`,
        'Press <b>Enter</b> to descend into the next mine');
    }

    const info = `Mine #${mineNo} · Depth ${Math.round(g.y / RH * 12)} m<br>Seed ${seed}`;
    if (info !== lastInfo) { mapInfoEl.innerHTML = info; lastInfo = info; }

    const behind = Math.max(0, Math.round((g.x + extents(g.facing)[0] - wallX) / 40));
    const stats = `💎 ${diamonds} &nbsp;·&nbsp; Speed ${Math.round(speedMult * 100)}% &nbsp;·&nbsp; ` +
      `<span class="${behind < 12 ? 'warn' : ''}">Cave-in ${behind} m behind</span>`;
    if (stats !== lastStats) { statsEl.innerHTML = stats; lastStats = stats; }
  }

  // ---------------------------------------------------------------------------
  // Parallax cavern background (factor: 0 = static, 1 = moves with world)
  // ---------------------------------------------------------------------------
  const layers = [
    { factor: 0.08, seed: 11, seg: 260, base: 0.30, amp: 0.22, color: '#1d1530', stalactite: true },
    { factor: 0.18, seed: 23, seg: 200, base: 0.42, amp: 0.20, color: '#271c3d', stalactite: true },
    { factor: 0.32, seed: 37, seg: 160, base: 0.56, amp: 0.16, color: '#33264a', stalactite: false },
    { factor: 0.55, seed: 51, seg: 120, base: 0.66, amp: 0.10, color: '#40305a', stalactite: false },
  ];

  function drawRidge(layer) {
    const off = camera.x * layer.factor;
    const step = 12;
    ctx.fillStyle = layer.color;
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let sx = -step; sx <= W + step; sx += step) {
      const wx = (sx + off) / layer.seg;
      const n = smoothNoise(wx, layer.seed) * 0.7 + smoothNoise(wx * 3.1, layer.seed + 5) * 0.3;
      ctx.lineTo(sx, H * layer.base + (1 - n) * H * layer.amp);
    }
    ctx.lineTo(W + step, H);
    ctx.closePath();
    ctx.fill();
  }

  function drawCeiling(layer) {
    const off = camera.x * layer.factor;
    const step = 12;
    ctx.fillStyle = layer.color;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    for (let sx = -step; sx <= W + step; sx += step) {
      const wx = (sx + off) / layer.seg;
      const n = smoothNoise(wx, layer.seed + 99);
      ctx.lineTo(sx, H * 0.04 + n * H * 0.08 * (1 + layer.factor * 2));
    }
    ctx.lineTo(W + step, 0);
    ctx.closePath();
    ctx.fill();

    const cell = 70;
    const first = Math.floor((off - cell) / cell);
    const last = Math.ceil((off + W + cell) / cell);
    for (let i = first; i <= last; i++) {
      if (hash(i, layer.seed + 7) < 0.45) continue;
      const sx = i * cell - off + hash(i, layer.seed + 3) * cell;
      const len = (0.05 + hash(i, layer.seed + 4) * 0.12) * H * (0.6 + layer.factor);
      const wid = 8 + hash(i, layer.seed + 8) * 18;
      const topY = H * 0.06;
      ctx.beginPath();
      ctx.moveTo(sx - wid, topY);
      ctx.lineTo(sx + wid, topY);
      ctx.lineTo(sx + 1, topY + len);
      ctx.lineTo(sx - 1, topY + len);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawCrystals(factor, salt) {
    const off = camera.x * factor;
    const cell = 180;
    const first = Math.floor((off - cell) / cell);
    const last = Math.ceil((off + W + cell) / cell);
    for (let i = first; i <= last; i++) {
      if (hash(i, salt) < 0.6) continue;
      const sx = i * cell - off + hash(i, salt + 1) * cell;
      const sy = H * (0.6 + hash(i, salt + 2) * 0.1);
      const hue = hash(i, salt + 3) < 0.5 ? 190 : 280;
      const s = 6 + hash(i, salt + 4) * 8;
      const pulse = 0.6 + 0.4 * Math.sin(time * 2 + i);
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, s * 5);
      g.addColorStop(0, `hsla(${hue}, 90%, 70%, ${0.35 * pulse})`);
      g.addColorStop(1, `hsla(${hue}, 90%, 50%, 0)`);
      ctx.fillStyle = g;
      ctx.fillRect(sx - s * 5, sy - s * 5, s * 10, s * 10);
      ctx.fillStyle = `hsla(${hue}, 80%, ${60 + pulse * 15}%, 0.9)`;
      ctx.beginPath();
      ctx.moveTo(sx, sy - s * 1.8);
      ctx.lineTo(sx + s * 0.5, sy);
      ctx.lineTo(sx, sy + s * 0.3);
      ctx.lineTo(sx - s * 0.5, sy);
      ctx.closePath();
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------------------
  // Mine rendering
  // ---------------------------------------------------------------------------
  function visibleRange() {
    return {
      s0: Math.floor(camera.x / CW) - 1,
      s1: Math.floor((camera.x + W) / CW) + 1,
      r0: Math.max(0, Math.floor(camera.y / RH) - 1),
      r1: Math.floor((camera.y + H + TUN_H) / RH) + 1,
    };
  }

  function drawRock() {
    const { s0, s1, r0, r1 } = visibleRange();
    rctx.save();
    rctx.globalCompositeOperation = 'source-over';
    rctx.fillStyle = '#2a2019';
    rctx.fillRect(0, 0, W, H);

    // World-locked stones embedded in the rock
    const cell = 64;
    const ix0 = Math.floor(camera.x / cell) - 1, ix1 = Math.floor((camera.x + W) / cell) + 1;
    const iy0 = Math.floor(camera.y / cell) - 1, iy1 = Math.floor((camera.y + H) / cell) + 1;
    for (let ix = ix0; ix <= ix1; ix++) {
      for (let iy = iy0; iy <= iy1; iy++) {
        const r = rnd(ix, iy, 50);
        if (r < 0.45) continue;
        const sx = ix * cell - camera.x + rnd(ix, iy, 51) * cell;
        const sy = iy * cell - camera.y + rnd(ix, iy, 52) * cell;
        const sz = 3 + rnd(ix, iy, 53) * 10;
        rctx.fillStyle = r < 0.75 ? '#211912' : '#3a2d22';
        rctx.beginPath();
        rctx.ellipse(sx, sy, sz * 1.4, sz, 0, 0, Math.PI * 2);
        rctx.fill();
      }
    }

    // Carve out tunnels, junction chambers and shafts
    rctx.globalCompositeOperation = 'destination-out';
    rctx.fillStyle = '#000';
    for (let row = r0; row <= r1; row++) {
      const fy = row * RH - camera.y;
      for (let s = s0; s <= s1; s++) {
        if (!segOpen(s, row)) continue;
        const x0 = s * CW, x1 = x0 + CW;
        rctx.beginPath();
        rctx.moveTo(x0 - camera.x, fy);
        for (let wx = x0; wx <= x1; wx += 30) {
          const bump = smoothNoise(wx / 140, row * 7 + 3) * 28;   // ceiling only ever carved upward
          rctx.lineTo(wx - camera.x, fy - TUN_H - bump);
        }
        rctx.lineTo(x1 - camera.x, fy);
        rctx.closePath();
        rctx.fill();
      }
      for (let j = s0; j <= s1 + 1; j++) {
        const jx = j * CW - camera.x;
        if (roomAt(j, row)) rctx.fillRect(jx - ROOM_HALF, fy - TUN_H - 10, ROOM_HALF * 2, TUN_H + 10);
        if (shaftAt(j, row)) rctx.fillRect(jx - SHAFT_HALF, fy - 2, SHAFT_HALF * 2, RH - TUN_H + 4);
      }
    }
    rctx.restore();
    ctx.drawImage(rockCanvas, 0, 0, W, H);
  }

  function drawMushroom(x, y, s, cap) {
    ctx.fillStyle = '#e8dcc0';
    ctx.fillRect(x - 2 * s, y - 10 * s, 4 * s, 10 * s);
    ctx.fillStyle = cap;
    ctx.beginPath();
    ctx.ellipse(x, y - 10 * s, 9 * s, 6 * s, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(x - 3 * s, y - 13 * s, 1.4 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + 3 * s, y - 12 * s, 1.1 * s, 0, Math.PI * 2); ctx.fill();
  }

  function drawTimber(x, fy, lantern) {
    const top = fy - TUN_H + 14;
    ctx.fillStyle = '#5b3d22';
    ctx.fillRect(x - 55, top, 10, TUN_H - 14);
    ctx.fillRect(x + 45, top, 10, TUN_H - 14);
    ctx.fillStyle = '#6e4a2a';
    ctx.fillRect(x - 62, top - 4, 124, 12);
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.fillRect(x - 62, top + 6, 124, 2);
    if (lantern) {
      const ly = top + 30, flick = 0.85 + 0.15 * Math.sin(time * 9 + x);
      const g = ctx.createRadialGradient(x, ly, 0, x, ly, 140);
      g.addColorStop(0, `rgba(255, 190, 90, ${0.32 * flick})`);
      g.addColorStop(1, 'rgba(255, 190, 90, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(x - 140, ly - 140, 280, 280);
      ctx.strokeStyle = '#2a2018';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x, top + 8); ctx.lineTo(x, ly - 8); ctx.stroke();
      ctx.fillStyle = '#2a2018';
      ctx.fillRect(x - 6, ly - 8, 12, 16);
      ctx.fillStyle = `rgba(255, 210, 120, ${flick})`;
      ctx.fillRect(x - 4, ly - 5, 8, 10);
    }
  }

  function drawLadder(x, yTop, yBot) {
    ctx.fillStyle = '#7a5532';
    ctx.fillRect(x - 16, yTop, 5, yBot - yTop);
    ctx.fillRect(x + 11, yTop, 5, yBot - yTop);
    ctx.fillStyle = '#8f6a42';
    for (let y = yBot - 14; y > yTop; y -= 22) ctx.fillRect(x - 13, y, 26, 4);
  }

  function drawHatch(x, fy) {
    ctx.fillStyle = '#4a3420';
    ctx.fillRect(x - SHAFT_HALF - 6, fy - 3, SHAFT_HALF * 2 + 12, 7);
    ctx.fillStyle = '#6e4a2a';
    for (let px = x - SHAFT_HALF - 4; px < x + SHAFT_HALF + 4; px += 12) ctx.fillRect(px, fy - 3, 8, 6);
  }

  function drawMineDetails() {
    const { s0, s1, r0, r1 } = visibleRange();
    for (let row = r0; row <= r1; row++) {
      const fy = row * RH - camera.y;
      for (let s = s0; s <= s1; s++) {
        if (!segOpen(s, row)) continue;
        const x0 = s * CW - camera.x;
        ctx.fillStyle = '#4c6b3a';
        ctx.fillRect(x0, fy - 2, CW, 4);
        for (let k = 0; k < 3; k++) {
          if (rnd(s, row, 20 + k) < 0.65) drawTimber(x0 + 150 + k * 300, fy, rnd(s, row, 30 + k) < 0.4);
        }
        for (let m = 0; m < 6; m++) {
          if (rnd(s, row, 40 + m) > 0.35) continue;
          const mx = x0 + 100 + m * 120 + rnd(s, row, 46 + m) * 60;
          drawMushroom(mx, fy, 0.6 + rnd(s, row, 52 + m) * 0.8, rnd(s, row, 58 + m) < 0.5 ? '#c0392b' : '#8e44ad');
        }
      }
      for (let j = s0; j <= s1 + 1; j++) {
        const jx = j * CW - camera.x;
        if (roomAt(j, row)) {
          ctx.fillStyle = '#4c6b3a';
          ctx.fillRect(jx - ROOM_HALF, fy - 2, ROOM_HALF * 2, 4);
        }
        if (shaftAt(j, row)) {
          drawLadder(jx, fy - 46, fy + RH);
          drawHatch(jx, fy);
        }
      }
    }
  }

  // --- Route hints at junctions: sparkle = more diamonds, dust = more junk ---
  function drawSparkleHint(x, y, k) {
    for (let i = 0; i < 5; i++) {
      const a = Math.max(0, Math.sin(time * 2.6 + i * 1.9 + k)) * 0.55;
      if (a < 0.02) continue;
      const px = x + Math.sin(i * 2.3 + k) * 28, py = y + Math.cos(i * 1.7 + k) * 22;
      const r = 2.5 + a * 3;
      ctx.fillStyle = `rgba(210, 240, 255, ${a})`;
      ctx.beginPath();
      ctx.moveTo(px, py - r * 1.6); ctx.lineTo(px + r * 0.35, py - r * 0.35);
      ctx.lineTo(px + r * 1.6, py); ctx.lineTo(px + r * 0.35, py + r * 0.35);
      ctx.lineTo(px, py + r * 1.6); ctx.lineTo(px - r * 0.35, py + r * 0.35);
      ctx.lineTo(px - r * 1.6, py); ctx.lineTo(px - r * 0.35, py - r * 0.35);
      ctx.closePath();
      ctx.fill();
    }
  }
  function drawDustHint(x, y, k) {
    for (let i = 0; i < 5; i++) {
      const t = (time * 0.35 + i / 5 + k * 0.13) % 1;
      const px = x + (i - 2) * 11 + t * 14, py = y + 12 - t * 34;
      ctx.fillStyle = `rgba(150, 128, 100, ${(1 - t) * t * 0.9})`;
      ctx.beginPath();
      ctx.arc(px, py, 8 + t * 16, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  function drawHint(x, y, value, k) {
    if (value > 0) drawSparkleHint(x, y, k);
    else if (value < 0) drawDustHint(x, y, k);
  }

  function drawRouteHints() {
    const { s0, s1, r0, r1 } = visibleRange();
    for (let row = r0; row <= r1; row++) {
      const fy = row * RH - camera.y;
      for (let j = s0; j <= s1 + 1; j++) {
        if (!roomAt(j, row)) continue;
        const jx = j * CW - camera.x;
        const k = j * 7 + row * 3;
        // Only junctions offering a choice get hints
        const up = shaftAt(j, row - 1), down = shaftAt(j, row);
        const options = (segOpen(j - 1, row) ? 1 : 0) + (segOpen(j, row) ? 1 : 0) + (up ? 1 : 0) + (down ? 1 : 0);
        if (options < 3) continue;
        if (segOpen(j, row)) drawHint(jx + ROOM_HALF + 50, fy - 70, segValue(j, row), k);
        if (segOpen(j - 1, row)) drawHint(jx - ROOM_HALF - 50, fy - 70, segValue(j - 1, row), k + 1);
        if (up) drawHint(jx, fy - TUN_H + 16, segValue(j - 1, row - 1) + segValue(j, row - 1), k + 2);
        if (down) drawHint(jx, fy - 18, segValue(j - 1, row + 1) + segValue(j, row + 1), k + 3);
      }
    }
  }

  // --- Items: identical glowing orbs from afar, true shape up close ---
  function drawOrb(x, y, a) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 24);
    g.addColorStop(0, `rgba(235, 235, 255, ${0.55 * a})`);
    g.addColorStop(1, 'rgba(235, 235, 255, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 24, y - 24, 48, 48);
    ctx.fillStyle = `rgba(250, 248, 255, ${0.9 * a})`;
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
  }

  function gemPath(c, x, y, s) {
    c.beginPath();
    c.moveTo(x - s, y - s * 0.4);
    c.lineTo(x - s * 0.5, y - s);
    c.lineTo(x + s * 0.5, y - s);
    c.lineTo(x + s, y - s * 0.4);
    c.lineTo(x, y + s);
    c.closePath();
  }

  function drawDiamond(x, y, a, s) {
    ctx.save();
    ctx.globalAlpha = a;
    const g = ctx.createRadialGradient(x, y, 0, x, y, s * 3);
    g.addColorStop(0, 'rgba(120, 230, 255, 0.4)');
    g.addColorStop(1, 'rgba(120, 230, 255, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - s * 3, y - s * 3, s * 6, s * 6);
    gemPath(ctx, x, y, s);
    ctx.fillStyle = '#6fe3ff';
    ctx.fill();
    ctx.strokeStyle = '#d8f8ff';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - s, y - s * 0.4); ctx.lineTo(x + s, y - s * 0.4);
    ctx.moveTo(x - s * 0.5, y - s); ctx.lineTo(x, y + s); ctx.lineTo(x + s * 0.5, y - s);
    ctx.stroke();
    const glint = Math.max(0, Math.sin(time * 3 + x));
    ctx.fillStyle = `rgba(255,255,255,${glint})`;
    ctx.fillRect(x - s * 0.55, y - s * 0.85, 2, 2);
    ctx.restore();
  }

  function drawJunk(x, y, a, variant) {
    ctx.save();
    ctx.globalAlpha = a;
    if (variant === 0) {
      // Dented rusty can
      ctx.fillStyle = '#7a5a3a';
      ctx.beginPath();
      ctx.moveTo(x - 7, y - 9); ctx.lineTo(x + 7, y - 8); ctx.lineTo(x + 6, y + 9); ctx.lineTo(x - 7, y + 9);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#5a3f26';
      ctx.fillRect(x - 7, y - 3, 14, 2);
      ctx.fillRect(x - 7, y + 3, 14, 2);
      ctx.fillStyle = '#a0522d';
      ctx.beginPath(); ctx.arc(x + 2, y - 5, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - 3, y + 6, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8a7a6a';
      ctx.beginPath(); ctx.ellipse(x, y - 9, 7, 2, 0.08, 0, Math.PI * 2); ctx.fill();
    } else {
      // Broken cog
      ctx.fillStyle = '#6d6a63';
      ctx.beginPath();
      for (let i = 0; i < 16; i++) {
        if (i === 11 || i === 12) continue;   // missing teeth
        const ang = (i / 16) * Math.PI * 2, r = i % 2 ? 7 : 10;
        ctx.lineTo(x + Math.cos(ang) * r, y + Math.sin(ang) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#3a3630';
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8b5a3c';
      ctx.beginPath(); ctx.arc(x - 4, y + 3, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawItems() {
    const g = gnome;
    const { s0, s1, r0, r1 } = visibleRange();
    const gcx = g.x, gcy = g.y - 30;
    for (let row = r0; row <= r1; row++) {
      for (let s = s0; s <= s1; s++) {
        for (const it of itemsFor(s, row)) {
          if (collected.has(it.id)) continue;
          const wy = row * RH - ITEM_LIFT + Math.sin(time * 2 + it.x) * 3;
          const x = it.x - camera.x, y = wy - camera.y;
          const dist = Math.hypot(it.x - gcx, wy - gcy);
          const t = Math.max(0, Math.min(1, (REVEAL_FAR - dist) / (REVEAL_FAR - REVEAL_NEAR)));
          if (t < 1) drawOrb(x, y, 1 - t);
          if (t > 0) {
            if (it.type === 'diamond') drawDiamond(x, y, t, 9);
            else drawJunk(x, y, t, it.variant);
          }
        }
      }
    }
  }

  function drawExit() {
    const x = exit.x - camera.x, fy = exit.row * RH - camera.y;
    if (x < -200 || x > W + 200 || fy < -50 || fy - TUN_H > H + 50) return;
    const pulse = 0.7 + 0.3 * Math.sin(time * 3);
    const g = ctx.createRadialGradient(x, fy - 60, 0, x, fy - 60, 180);
    g.addColorStop(0, `rgba(140, 255, 170, ${0.45 * pulse})`);
    g.addColorStop(1, 'rgba(140, 255, 170, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 180, fy - 240, 360, 360);

    ctx.fillStyle = '#4a3420';
    ctx.beginPath();
    ctx.moveTo(x - 40, fy);
    ctx.lineTo(x - 40, fy - 90);
    ctx.arc(x, fy - 90, 40, Math.PI, 0);
    ctx.lineTo(x + 40, fy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = `rgba(200, 255, 210, ${0.75 + 0.25 * pulse})`;
    ctx.beginPath();
    ctx.moveTo(x - 30, fy);
    ctx.lineTo(x - 30, fy - 90);
    ctx.arc(x, fy - 90, 30, Math.PI, 0);
    ctx.lineTo(x + 30, fy);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#f2c14e';
    ctx.font = 'bold 14px Trebuchet MS, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('EXIT', x, fy - 140);
  }

  function drawJunctionPrompts() {
    const g = gnome;
    if (g.climb || !g.onGround || state !== 'play') return;
    const jn = junctionInfo();
    if (!jn.canUp && !jn.canDown) return;
    const sx = g.x - camera.x, sy = g.y - camera.y;
    const a = 0.6 + 0.4 * Math.sin(time * 6);
    ctx.save();
    ctx.font = 'bold 14px Trebuchet MS, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#f2c14e';
    ctx.shadowBlur = 10;
    ctx.fillStyle = `rgba(242, 193, 78, ${a})`;
    if (jn.canUp) ctx.fillText('▲ W', sx, sy - 88);
    if (jn.canDown) ctx.fillText('▼ S', sx, sy + 26);
    ctx.restore();
  }

  function drawParticles() {
    for (const p of particles) {
      const x = p.x - camera.x, y = p.y - camera.y, a = Math.min(1, p.life / p.max * 1.5);
      if (p.kind === 'spark') {
        ctx.fillStyle = `rgba(190, 245, 255, ${a})`;
        ctx.fillRect(x - p.size / 2, y - p.size / 2, p.size, p.size);
      } else if (p.kind === 'dust') {
        ctx.fillStyle = `rgba(120, 100, 80, ${a * 0.35})`;
        ctx.beginPath(); ctx.arc(x, y, p.size * (1.6 - p.life / p.max * 0.6), 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'gem') {
        ctx.save(); ctx.globalAlpha = a;
        gemPath(ctx, x, y, p.size); ctx.fillStyle = '#6fe3ff'; ctx.fill();
        ctx.restore();
      } else if (p.kind === 'rock') {
        ctx.fillStyle = `rgba(30, 22, 16, ${a})`;
        ctx.fillRect(x - p.size / 2, y - p.size / 2, p.size, p.size);
      } else if (p.kind === 'text') {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = 'bold 16px Trebuchet MS, sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.strokeText(p.text, x, y);
        ctx.fillStyle = p.color;
        ctx.fillText(p.text, x, y);
        ctx.restore();
      }
    }
  }

  function drawWall() {
    const sx = wallX - camera.x;
    if (sx < -60) return;
    ctx.save();
    // Jagged collapsing face
    ctx.beginPath();
    ctx.moveTo(-20, -20);
    for (let y = -20; y <= H + 40; y += 24) {
      const jag = (smoothNoise((y + camera.y) / 45 + time * 0.8, 900) - 0.5) * 34;
      ctx.lineTo(sx + jag, y);
    }
    ctx.lineTo(-20, H + 40);
    ctx.closePath();
    const g = ctx.createLinearGradient(sx - 220, 0, sx + 20, 0);
    g.addColorStop(0, '#050307');
    g.addColorStop(0.8, '#120b0a');
    g.addColorStop(1, '#2a1712');
    ctx.fillStyle = g;
    ctx.fill();
    // Embedded boulders
    for (let i = 0; i < 14; i++) {
      const by = ((hash(i, 910) * (H + 200) - camera.y * 0.9) % (H + 200) + H + 200) % (H + 200) - 100;
      const bx = sx - 20 - hash(i, 911) * 160;
      ctx.fillStyle = '#1c1310';
      ctx.beginPath(); ctx.ellipse(bx, by, 16 + hash(i, 912) * 20, 12 + hash(i, 913) * 14, i, 0, Math.PI * 2); ctx.fill();
    }
    // Ominous glow at the face
    const glow = ctx.createLinearGradient(sx - 10, 0, sx + 70, 0);
    glow.addColorStop(0, `rgba(160, 50, 20, ${0.25 + 0.1 * Math.sin(time * 7)})`);
    glow.addColorStop(1, 'rgba(160, 50, 20, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(sx - 10, 0, 80, H);
    ctx.restore();
  }

  function drawDust() {
    const factor = 1.25;
    const off = camera.x * factor;
    const cell = 90;
    const first = Math.floor((off - cell) / cell);
    const last = Math.ceil((off + W + cell) / cell);
    for (let i = first; i <= last; i++) {
      const sx = i * cell - off + hash(i, 701) * cell;
      const raw = hash(i, 702) * H + time * (8 + hash(i, 703) * 12) - camera.y * 1.1;
      const sy = ((raw % H) + H) % H;
      const a = 0.15 + 0.2 * Math.sin(time * 1.5 + i);
      ctx.fillStyle = `rgba(242, 193, 78, ${a})`;
      ctx.beginPath();
      ctx.arc(sx, sy, 1 + hash(i, 704) * 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // ---------------------------------------------------------------------------
  // Gnome + wheelbarrow rendering (local space: facing right, feet at 0,0)
  // ---------------------------------------------------------------------------
  const PILE_ROWS = [5, 4, 3, 2, 1];   // diamonds per pile layer, bottom to top

  function drawWheelbarrow() {
    const g = gnome;
    // Handles
    ctx.strokeStyle = '#6e4a2a';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(12, -22); ctx.lineTo(28, -30); ctx.stroke();
    // Support leg
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(32, -15); ctx.lineTo(30, -2); ctx.stroke();

    // Diamond pile (drawn first so the tray front overlaps its base)
    let shown = 0;
    for (let layer = 0; layer < PILE_ROWS.length && shown < diamonds; layer++) {
      const n = PILE_ROWS[layer];
      for (let i = 0; i < n && shown < diamonds; i++, shown++) {
        const px = 44 + (i - (n - 1) / 2) * 7.5;
        const py = -36 - layer * 6;
        gemPath(ctx, px, py, 4);
        ctx.fillStyle = (i + layer) % 2 ? '#6fe3ff' : '#9df0ff';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 0.8;
        ctx.stroke();
      }
    }
    if (diamonds > 0) {
      const glint = Math.max(0, Math.sin(time * 4));
      ctx.fillStyle = `rgba(255,255,255,${glint * 0.9})`;
      ctx.fillRect(42, -38 - Math.min(4, Math.ceil(diamonds / 5)) * 6, 2, 2);
    }

    // Tray
    ctx.fillStyle = '#7a7f86';
    ctx.beginPath();
    ctx.moveTo(22, -36); ctx.lineTo(68, -38); ctx.lineTo(62, -14); ctx.lineTo(30, -14);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#5c6066';
    ctx.fillRect(22, -37, 46, 3);
    ctx.fillStyle = 'rgba(160, 82, 45, 0.6)';
    ctx.beginPath(); ctx.arc(52, -24, 3, 0, Math.PI * 2); ctx.fill();

    if (diamonds > 15) {
      ctx.font = 'bold 11px Trebuchet MS, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#d8f8ff';
      ctx.fillText('+' + (diamonds - 15), 45, -26);
    }

    // Wheel
    ctx.save();
    ctx.translate(50, -8);
    ctx.rotate(g.wheelAngle);
    ctx.fillStyle = '#2b2018';
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#8f6a42';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 7, Math.sin(a) * 7);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawGnome(sx, sy) {
    const g = gnome;
    ctx.save();
    ctx.translate(sx, sy);

    if (!g.climb) {
      const airH = Math.max(0, g.row * RH - g.y);
      const shadowS = Math.max(0.3, 1 - airH / 250);
      ctx.fillStyle = `rgba(0,0,0,${0.35 * shadowS})`;
      ctx.beginPath();
      ctx.ellipse(g.facing * 22, airH, 44 * shadowS, 5 * shadowS, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Wheelbarrow strapped to his back while on the ladder
      ctx.save();
      ctx.scale(g.facing, 1);
      ctx.translate(-6, -16);
      ctx.rotate(-1.35);
      ctx.scale(0.65, 0.65);
      ctx.translate(-40, 22);
      drawWheelbarrow();
      ctx.restore();
    }

    const moving = (Math.abs(g.vx) > 10 && g.onGround) || !!g.climb;
    const swing = moving ? Math.sin(g.walkPhase) : 0;
    const bob = moving ? Math.abs(Math.sin(g.walkPhase)) * 2 : 0;
    const grounded = g.onGround || g.climb;

    ctx.save();
    ctx.scale(g.facing * (2 - g.squash), g.squash);

    // Legs / boots
    ctx.fillStyle = '#3b2a1a';
    const legL = grounded ? swing * 6 : -4;
    const legR = grounded ? -swing * 6 : 5;
    ctx.fillRect(-8 + legL, -12, 6, 10);
    ctx.fillRect(2 + legR, -12, 6, 10);
    ctx.fillStyle = '#1e140c';
    ctx.beginPath(); ctx.ellipse(-4 + legL, -2, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(6 + legR, -2, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();

    ctx.translate(0, -bob);

    // Body (tunic)
    ctx.fillStyle = '#2f6e3b';
    ctx.beginPath();
    ctx.moveTo(-12, -10);
    ctx.lineTo(12, -10);
    ctx.lineTo(9, -32);
    ctx.lineTo(-9, -32);
    ctx.closePath();
    ctx.fill();

    // Belt
    ctx.fillStyle = '#4a3420';
    ctx.fillRect(-11, -17, 22, 4);
    ctx.fillStyle = '#f2c14e';
    ctx.fillRect(-2, -17, 4, 4);

    // Arm reaching up the ladder while climbing
    if (g.climb) {
      ctx.save();
      ctx.translate(2, -28);
      ctx.rotate(Math.PI * (0.85 + 0.1 * swing));
      ctx.fillStyle = '#2a5f33';
      ctx.fillRect(-3, 0, 6, 13);
      ctx.fillStyle = '#f0c8a0';
      ctx.beginPath(); ctx.arc(0, 14, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Head
    ctx.fillStyle = '#f0c8a0';
    ctx.beginPath(); ctx.arc(1, -38, 8, 0, Math.PI * 2); ctx.fill();

    // Beard
    ctx.fillStyle = '#ece6da';
    ctx.beginPath();
    ctx.moveTo(-6, -38);
    ctx.quadraticCurveTo(-4, -18, 4, -20);
    ctx.quadraticCurveTo(10, -24, 9, -38);
    ctx.closePath();
    ctx.fill();

    // Nose
    ctx.fillStyle = '#e09a7a';
    ctx.beginPath(); ctx.arc(8, -38, 3.2, 0, Math.PI * 2); ctx.fill();

    // Eye
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(5, -41, 1.3, 0, Math.PI * 2); ctx.fill();

    // Hat (droops back with speed)
    const droop = Math.max(-1, Math.min(1, -g.vx * g.facing / MAX_SPEED)) * 8 + (g.vy < 0 ? 6 : 0);
    ctx.fillStyle = '#b8322a';
    ctx.beginPath();
    ctx.moveTo(-9, -42);
    ctx.lineTo(11, -42);
    ctx.quadraticCurveTo(4, -56, -4 + droop, -68);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#8f241e';
    ctx.fillRect(-10, -44, 22, 4);
    ctx.restore();

    // Wheelbarrow in front, with his arm on the handles
    if (!g.climb) {
      ctx.save();
      ctx.scale(g.facing, 1);
      ctx.translate(0, -bob);
      drawWheelbarrow();
      ctx.save();
      ctx.translate(2, -27);
      ctx.rotate(-1.2);
      ctx.fillStyle = '#2a5f33';
      ctx.fillRect(-3, 0, 6, 13);
      ctx.fillStyle = '#f0c8a0';
      ctx.beginPath(); ctx.arc(0, 14, 3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      ctx.restore();
    }

    ctx.restore();
  }

  // ---------------------------------------------------------------------------
  // Minimap — draws ONLY explored tunnel geometry, the gnome and an exit
  // pointer. Items on paths must never be drawn here.
  // ---------------------------------------------------------------------------
  function drawMinimap() {
    const g = gnome;
    const cellW = mapBig ? 34 : 22, cellH = mapBig ? 26 : 18;
    const gs = g.x / CW, gr = g.y / RH;
    const toMap = (seg, row) => [MW / 2 + (seg - gs) * cellW, MH / 2 + (row - gr) * cellH];

    mctx.clearRect(0, 0, MW, MH);
    mctx.fillStyle = '#0d0a14';
    mctx.fillRect(0, 0, MW, MH);

    const s0 = Math.floor(gs - MW / 2 / cellW) - 1, s1 = Math.ceil(gs + MW / 2 / cellW) + 1;
    const r0 = Math.max(0, Math.floor(gr - MH / 2 / cellH) - 1), r1 = Math.ceil(gr + MH / 2 / cellH) + 1;

    mctx.lineCap = 'round';
    mctx.strokeStyle = '#8fb3c9';
    mctx.lineWidth = 2;
    for (let row = r0 - 1; row <= r1; row++) {
      for (let j = s0; j <= s1 + 1; j++) {
        if (!explored.has('j' + j + ',' + row)) continue;
        const [x, y0] = toMap(j, row), [, y1] = toMap(j, row + 1);
        mctx.beginPath(); mctx.moveTo(x, y0); mctx.lineTo(x, y1); mctx.stroke();
      }
    }
    mctx.strokeStyle = '#c9a66b';
    mctx.lineWidth = mapBig ? 6 : 5;
    for (let row = r0; row <= r1; row++) {
      for (let s = s0; s <= s1; s++) {
        if (!explored.has('s' + s + ',' + row)) continue;
        const [x0, y] = toMap(s, row), [x1] = toMap(s + 1, row);
        mctx.beginPath(); mctx.moveTo(x0 + 1, y); mctx.lineTo(x1 - 1, y); mctx.stroke();
      }
    }

    // Cave-in front
    const [wx] = toMap(wallX / CW, 0);
    if (wx > 0) {
      mctx.fillStyle = 'rgba(120, 30, 20, 0.45)';
      mctx.fillRect(0, 0, Math.min(MW, wx), MH);
    }

    // Exit: a glowing beacon when in view, otherwise a glowing arrow on the edge pointing at it
    const pulse = 0.6 + 0.4 * Math.sin(time * 4);
    const [ex, ey] = toMap(exit.x / CW, exit.row);
    const margin = 12;
    mctx.save();
    mctx.shadowColor = '#8cffaa';
    mctx.shadowBlur = 12 * pulse + 6;
    mctx.fillStyle = `rgba(160, 255, 185, ${0.7 + 0.3 * pulse})`;
    if (ex > margin && ex < MW - margin && ey > margin && ey < MH - margin) {
      mctx.beginPath();
      mctx.moveTo(ex, ey - 7); mctx.lineTo(ex + 6, ey); mctx.lineTo(ex, ey + 7); mctx.lineTo(ex - 6, ey);
      mctx.closePath();
      mctx.fill();
    } else {
      const dx = ex - MW / 2, dy = ey - MH / 2;
      const t = Math.min((MW / 2 - margin) / Math.abs(dx || 1e-6), (MH / 2 - margin) / Math.abs(dy || 1e-6));
      const ax = MW / 2 + dx * t, ay = MH / 2 + dy * t;
      mctx.translate(ax, ay);
      mctx.rotate(Math.atan2(dy, dx));
      mctx.beginPath();
      mctx.moveTo(9, 0); mctx.lineTo(-6, -7); mctx.lineTo(-2, 0); mctx.lineTo(-6, 7);
      mctx.closePath();
      mctx.fill();
    }
    mctx.restore();

    // Gnome
    mctx.fillStyle = '#ff5a4a';
    mctx.strokeStyle = '#fff';
    mctx.lineWidth = 1.5;
    mctx.beginPath();
    mctx.arc(MW / 2, MH / 2, 4, 0, Math.PI * 2);
    mctx.fill();
    mctx.stroke();
  }

  // ---------------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------------
  function render() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#07050c');
    bg.addColorStop(0.5, '#140e22');
    bg.addColorStop(1, '#1f1630');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < layers.length; i++) {
      const L = layers[i];
      if (L.stalactite) drawCeiling(L);
      drawRidge(L);
      if (i === 1) drawCrystals(0.25, 77);
    }

    // Haze, darkening the further down we go
    const depthDark = Math.min(0.5, gnome.y / RH * 0.04);
    ctx.fillStyle = `rgba(10, 6, 16, ${0.25 + depthDark})`;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawRock();
    drawMineDetails();
    drawRouteHints();
    drawItems();
    drawExit();
    drawGnome(gnome.x - camera.x, gnome.y - camera.y);
    drawJunctionPrompts();
    drawParticles();
    drawWall();
    drawDust();
    ctx.restore();

    // Red danger tint on the left as the cave-in closes in
    const gap = gnome.x - GNOME_BACK - wallX;
    if (gap < 600 && state !== 'won') {
      const a = (1 - Math.max(0, gap) / 600) * (0.35 + 0.1 * Math.sin(time * 8));
      const d = ctx.createLinearGradient(0, 0, W * 0.35, 0);
      d.addColorStop(0, `rgba(170, 30, 15, ${a})`);
      d.addColorStop(1, 'rgba(170, 30, 15, 0)');
      ctx.fillStyle = d;
      ctx.fillRect(0, 0, W * 0.35, H);
    }

    const v = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, W, H);

    drawMinimap();
  }

  // ---------------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------------
  window.addEventListener('resize', resize);
  resize();

  const urlSeed = parseInt(new URLSearchParams(location.search).get('seed'), 10);
  initMine(Number.isFinite(urlSeed) ? urlSeed : (Math.random() * 4294967296) >>> 0);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
